<!doctype html>
<html>
  <head>
    <title>Change Password (Admin)</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="navbar">
      <button
        onclick="if (confirm('Are you sure you want to log out?')) { window.location.href='{{ url_for('logout') }}'; }"
      >
        Log Out
      </button>
      {% if session.get('role') == 'admin' %}
      <button onclick="location.href='{{ url_for('admin') }}'">
        Home Page
      </button>
      <button onclick="location.href='{{ url_for('actionsAudit') }}'">
        Audit Logs
      </button>
      {% else %}
      <button onclick="location.href='{{ url_for('user') }}'">Home Page</button>
      {% endif %}
      <button onclick="location.href='{{ url_for('inventory') }}'">
        Inventory Management
      </button>
      <button onclick="location.href='{{ url_for('datacenter') }}'">
        Datacenter Management
      </button>
      {% if session.get('role') == 'admin' %}
      <button onclick="location.href='{{ url_for('create_user') }}'">
        Create User
      </button>
      {% endif %}

      <button onclick="location.href='{{ url_for('change_password') }}'">
        Change Password
      </button>
    </div>
    <div class="login">
      {% with messages = get_flashed_messages() %} {% if messages %}
      <ul style="color: red">
        {% for message in messages %}
        <li>{{ message }}</li>
        {% endfor %}
      </ul>
      {% endif %} {% endwith %}
      <h2>Change Your Password</h2>

      <form method="POST">
        <label>New Password</label><br />

        <input type="password" name="password" required minlength="8" />
        <label>Confirm Password</label>
        <input type="password" name="confirm_password" required />
        <br /><br />

        <button type="submit">Change Password</button>
      </form>
    </div>
  </body>
</html>
