<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Datacenter Management</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="navbar">
      <button onclick="location.href='{{ url_for('logout') }}'">Log Out</button>
      {% if session.get('role') == 'admin' %}
      <button onclick="location.href='{{ url_for('admin') }}'">
        Home Page
      </button>
      <button onclick="location.href='{{ url_for('actionsAudit') }}'">
        Audit Logs
      </button>
      {% else %}
      <button onclick="location.href='{{ url_for('user') }}'">Home Page</button>
      {% endif %}
      <button onclick="location.href='{{ url_for('inventory') }}'">
        Inventory Management
      </button>
      <button onclick="location.href='{{ url_for('datacenter') }}'">
        Datacenter Management
      </button>
    </div>
    <div class="subtitle">
      <h2>Datacenter Management</h2>
      <!-- Message Display -->
      <div id="message" style="margin-top: 10px; font-weight: bold"></div>
    </div>
    <!-- Add Datacenter Form -->
    <div class="form-section">
      <h2>Add Datacenter</h2>
      <form id="addDatacenterForm">
        <input type="text" id="addLocation" placeholder="Location" required />
        <input type="number" id="addCapacity" placeholder="Capacity" required />
        <button type="submit">Add</button>
      </form>
    </div>

    <div class="form-section">
      <!-- Update Datacenter Form -->
      <h2>Update Datacenter</h2>
      <form id="updateDatacenterForm">
        <input
          type="number"
          id="updateDatacenterID"
          placeholder="Datacenter ID"
          required
        />
        <input
          type="number"
          id="updateCapacity"
          placeholder="New Capacity"
          required
        />
        <button type="submit">Update</button>
      </form>
    </div>
    <!-- Delete Datacenter Form -->
    {% if session.get('role') == 'admin' %}
    <div class="form-section">
      <h2>Delete Datacenter</h2>
      <form id="deleteDatacenterForm">
        <input
          type="number"
          id="deleteDatacenterID"
          placeholder="Datacenter ID"
          required
        />
        <button type="submit">Delete</button>
      </form>
    </div>
    {% endif %}

    <!-- Display List of Datacenters -->
    <div class="form-section">
      <h2>All Datacenters</h2>

      <table id="datacenterTable">
        <thead>
          <tr>
            <th>ID</th>
            <th>Location</th>
            <th>Capacity</th>
          </tr>
        </thead>
        <tbody>
          <!-- Rows will be inserted here -->
        </tbody>
      </table>
    </div>
    <div id="datacenterList"></div>

    <!-- Javascript file -->
    <script src="/static/js/datacenter.js"></script>
  </body>
</html>
